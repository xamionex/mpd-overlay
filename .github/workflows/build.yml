name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths:
      - '.github/workflows/build.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**/*'

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      # Zig provides glibc 2.28 compatibility for SteamOS.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            pkg-config \
            cmake \
            libgtk-3-dev \
            libclang-dev \
            libglib2.0-dev \
            libx11-dev

      - name: Test
        run: cargo test

      - name: Define GIT_HASH
        id: sha
        run: echo "GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28
        env:
          GIT_HASH: ${{ steps.sha.outputs.GIT_HASH }}
          RUSTFLAGS: "-Awarnings -L native=/usr/lib/x86_64-linux-gnu -L native=/usr/lib"
          CFLAGS: "-isystem /usr/include"
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: "1"
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: "1"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpd-overlay-linux
          path: target/x86_64-unknown-linux-gnu/release/mpd-overlay
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: mpd-overlay-linux
          path: ./dist

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./dist/mpd-overlay
          generate_release_notes: true
